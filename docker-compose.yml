services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_TRELLO_API_KEY: ${NEXT_PUBLIC_TRELLO_API_KEY:-}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://newtab:newtab@postgres:5432/newtab
      REDIS_URL: redis://redis:6379
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEXT_PUBLIC_TRELLO_API_KEY: ${NEXT_PUBLIC_TRELLO_API_KEY:-}
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: newtab
      POSTGRES_PASSWORD: newtab
      POSTGRES_DB: newtab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
